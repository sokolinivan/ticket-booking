services:
  ticketbooking-api:
    build:
      context: .
      dockerfile: src/Backend/TicketBooking.Api/Dockerfile
    environment:
      ConnectionStrings__ticketbooking: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticketbooking};Username=${POSTGRES_USER:?required};Password=${POSTGRES_PASSWORD:?required}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      POSTGRES_DB: "${POSTGRES_DB:-ticketbooking}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
